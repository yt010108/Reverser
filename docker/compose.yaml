name: reverser
services:
  core:
    image: local/yt010108-reverser-core:0.1
    build:
      context: ./core
  dynamic:
    image: local/yt010108-reverser-dynamic:0.1
    build:
      context: ./dynamic
      args:
        CORE_IMAGE: local/yt010108-reverser-core:0.1
  ghidra:
    image: local/yt010108-reverser-ghidra:0.1
    build:
      context: ./ghidra
      args:
        CORE_IMAGE: local/yt010108-reverser-core:0.1
  angr:
    image: local/yt010108-reverser-angr:0.1
    build:
      context: ./angr
      args:
        CORE_IMAGE: local/yt010108-reverser-core:0.1
